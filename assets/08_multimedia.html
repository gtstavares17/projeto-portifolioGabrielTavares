<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Tabelas Avançadas e MultiMídia</title>
    <style>
        /* Define a largura da tabela para 50% de largura do elemento pai (normalmente o body) */
        table {
            width: 50%;
            /* tabela fica proporcionalmente menor e mais compacto */

            /* Remove o espaçamento entre as bordas adjacentes para apresentar bordas únicas */
            border-collapse: collapse;

            /* Espaço inferior para separar visualmente da próxima seção */
            margin-bottom: 20px;
        }

        /* Aplica borda e espaçamento interno tanto em cabeçalhos (th) quanto em células (td) */
        th,
        td {
            border: 1px solid black;
            /* bordas pretas sólidas de 1px */
            padding: 8px;
            /* espaçamento interno para "respirar" o conteúdo */
        }

        /* Estiliza as céulas do cabeçalho */
        th {
            background-color: #333;
            /* fundo escuro para destaque */
            color: white;
            /* texto branco para contraste e legibilidade*/
        }

        /* Estiliza a linha do rodapé da tabela */
        tfoot {
            background-color: #ffff99;
            /* fundo amarelo claro para chamar atenção */
            font-weight: bold;
            /* texto em negrito para impotância */
        }

        /* Classe para alinhar texto à direita (útil para números e valores monetários) */
        td.num-right {
            text-align: right;
            /* valores alinhados à direita para facilitar leitura numérica */
        }
    </style>
</head>

<body>
    <h1>Relatório de Vendas</h1>

    <!-- TABELA SIMPLIFICADA E MAIS COMPACTA -->
    <table>
        <caption>Vendas por Região - 2025</caption>
        <thead>
            <tr>
                <!-- Cabeçalho para coluna região -->
                <th>Região</th>
                <!-- Cabeçalho para os trimestres -->
                <th>1° Tri</th>
                <th>2° Tri</th>
                <th>3° Tri</th>
                <!-- Cabeçalho para o total geral -->
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!-- Linha de dados para a região Norte -->
                <td>Norte</td>
                <td class="num-right">R$ 10.000</td>
                <td class="num-right">R$ 12.000</td>
                <td class="num-right">R$ 15.000</td>
                <td class="num-right"><strong>R$ 37.000</strong></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <!-- Rodapé com total geral -->
                <td>Total Geral</td>
                <td class="num-right">R$ 10.000</td>
                <td class="num-right">R$ 12.000</td>
                <td class="num-right">R$ 15.000</td>
                <td class="num-right"><strong>R$ 37.000</strong></td>
            </tr>
        </tfoot>
    </table>

    <hr>

    <!-- MULTIMÍDIA EM HTML5 -->

    <H2>Inserindo vídeos locais</H2>
    <!-- Vídeo de exemplo local; reproduz inline em dispositivos móveis. -->
    <video width="500" preload="metadata" playsinline controls>
        <source src="assets/video-exemplo.mp4" type="video/mp4">
        <!-- Mensagem que aparece se o navegador não suporta a tag video -->
        Seu navegador não suporta video HTML5
    </video>
    <hr>

    <h2>Inserir vídeos do Youtube</h2>
    <!-- Vídeo insorpado vai iframe com configurações para controle de permissão -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/eqUFcr1mI3Y" frameborder="0"
        
    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>

    </iframe>
    <hr>

    <h2>Vamos aprender a reproduzir áudios em HTML5.</h2>
    <!-- Reprodução iniciada pelo usuário, pois navegadores bloqueiam autoplay com áudio. -->
    <audio preload="metadata" autopaly controls>
        <source src="assets/audio-exemplo.mp3" type="audio/mpeg">
        <!-- Mensagem alternativa caso áudio não seja suportado -->
        Seu navegador não suporta áudio HTML5.
    </audio>
</body>

</html>
