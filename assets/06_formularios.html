<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de cadastro</title>
</head>

<body>
    <!-- formulário com método POST -->
    <form action="processar.php" method="post">

        <!-- Campo de texto simples -->
        <label for="nome">Nome Completo:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <!-- Campo de email com validação -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <!-- Campo de senha -->
        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" required><br><br>

        <!-- Botão de opção (radio) -->
        <label>Sexo:</label>
        <input type="radio" id="masculino" name="sexo" value="M">
        <label for="masculino">Masculino</label><br>
        <input type="radio" id="feminino" name="sexo" value="F">
        <label for="feminino">Feminino</label><br><br>

        <!-- Caixas de seleção (checkbox) -->
        <label>Interesses:</label><br>
        <input type="checkbox" id="programacao" name="Interesses[]" value="programacao">
        <label for="programacao">Programação</label>
        <input type="checkbox" id="design" name="Interesses[]" value="design">
        <label for="design">Design</label><br><br>

        <!-- Lista de seleção (select) -->
        <label for="cidade">Cidade:</label><br>
        <select id="cidade" name="cidade">
            <option value="">Selecione uma cidade</option>
            <option value="sp">São Paulo</option>
            <option value="rj">Rio de Janeiro</option>
            <option value="mg">Belo Horizonte</option>
        </select><br><br>

        <!-- Área de texto -->
        <label for="comentarios">Comentários</label><br>
        <textarea id="comentarios" name="comentarios" rows="4" cols="50"></textarea><br><br>

        <!-- Campo de arquivo -->
        <label for="foto">Foto:</label><br>
        <input type="file" id="foto" name="foto"><br><br>

        <!-- Botões do formulário -->
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
</body>

</html>
